name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安裝 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: 安裝依賴
        run: composer install --no-progress --prefer-dist

      - name: 執行測試
        run: ./vendor/bin/phpunit tests/
